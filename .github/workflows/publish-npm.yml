name: Publish edgrapi-mcp to npm

# Its own tag prefix: `v*` already publishes server.json to the MCP registry,
# and the npm bridge versions independently of that manifest.
on:
  push:
    tags: ["npm-v*"]
  workflow_dispatch:

defaults:
  run:
    working-directory: npm

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance

    steps:
      - uses: actions/checkout@v5

      # Node 24, not 22: trusted publishing needs npm >= 11.5.1, and Node 22 still
      # ships npm 10.x. This works the same for token publishing, so the workflow
      # is ready the day we switch to OIDC and drop NPM_TOKEN.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in a release build

      # Nothing to install — the bridge is dependency-free. This speaks real MCP
      # to the live server, so a broken bridge never reaches npm.
      - name: Smoke test
        run: node test/smoke.js

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
